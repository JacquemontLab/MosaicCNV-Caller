name: Build and push Docker images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: bcftools-mocha
            context: docker/bcftools-mocha
            dockerfile: docker/bcftools-mocha/Dockerfile
            tag: "1.20"
          - name: python-polars
            context: docker/polars
            dockerfile: docker/polars/Dockerfile
            tag: "1.43.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        # Skip login on PRs from forks, which don't get write access to secrets/GITHUB_TOKEN
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Only push on main-branch pushes and manual runs; PRs just build to validate
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}